# pylings catalog: every exercise, in the order you should do them (easy -> hard).
#
#   name      unique id; `python3 -m pylings run <name>` (a unique prefix works too)
#   level     warm-up | middle | middle+ | senior | staff
#   mode      "test" (default: done when the tests pass) or "review" (code review, marked by hand)
#   path      the file you edit
#   test      the file that runs the tests (warm-ups carry their tests inside)
#   solution  reference solution / answer key
#   hints     shown one at a time with `h` in watch mode

