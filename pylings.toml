  "With an exception, `gen.throw(exc)`. If the same object comes back out, return False; StopIteration means it was swallowed, so return True.",
  "PEP 479: a StopIteration thrown into a generator comes out as RuntimeError whose __cause__ is your exception. For the decorator form, keep the function and its arguments so each call can make a fresh generator.",
]

